name: Intel Extreme source guardrails

on:
  push:
    branches:
      - work/intel-extreme-hd530-edid-2d
    paths:
      - "src/add-ons/accelerants/intel_extreme/**"
      - "src/add-ons/kernel/drivers/graphics/intel_extreme/**"
      - "headers/private/graphics/intel_extreme/**"
      - ".github/workflows/intel-extreme-source-guards.yml"
  pull_request:
    paths:
      - "src/add-ons/accelerants/intel_extreme/**"
      - "src/add-ons/kernel/drivers/graphics/intel_extreme/**"
      - "headers/private/graphics/intel_extreme/**"
      - ".github/workflows/intel-extreme-source-guards.yml"

permissions:
  contents: read

jobs:
  source-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Rocket Lake and PCI-ID policy
        run: python3 src/add-ons/accelerants/intel_extreme/tests/validate_rkl_alchemist_battlemage.py
      - name: Validate Gen1-8 CPU-only policy
        run: python3 src/add-ons/accelerants/intel_extreme/tests/validate_gen1_8_cpu_only.py
      - name: Validate Gen10-12 fail-closed policy
        run: python3 src/add-ons/accelerants/intel_extreme/tests/validate_gen10_12_fail_closed.py
